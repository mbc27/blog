<!DOCTYPE html>
<html>
<head>
    <title>测试图片上传</title>
</head>
<body>
    <h2>测试图片上传功能</h2>
    <form id="uploadForm" enctype="multipart/form-data">
        <input type="file" id="fileInput" accept="image/*" required>
        <button type="submit">上传图片</button>
    </form>
    
    <div id="result"></div>
    
    <script>
        document.getElementById('uploadForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const fileInput = document.getElementById('fileInput');
            const file = fileInput.files[0];
            
            if (!file) {
                alert('请选择文件');
                return;
            }
            
            const formData = new FormData();
            formData.append('file', file);
            
            try {
                const response = await fetch('http://localhost:8080/upload/image', {
                    method: 'POST',
                    body: formData
                });
                
                const result = await response.json();
                document.getElementById('result').innerHTML = '<pre>' + JSON.stringify(result, null, 2) + '</pre>';
                
                if (result.success && result.data && result.data.url) {
                    document.getElementById('result').innerHTML += '<br><img src="' + result.data.url + '" style="max-width: 300px;">';
                }
            } catch (error) {
                document.getElementById('result').innerHTML = '<p style="color: red;">错误: ' + error.message + '</p>';
            }
        });
    </script>
</body>
</html>
